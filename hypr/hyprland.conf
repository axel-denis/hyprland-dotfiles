# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,1
monitor = , preferred, 0x0, 1
#monitor = DP-1, preferred, 1920x-800, 1, transform, 1
#monitor = DP-3, preferred, -1080x-400, 1, transform, 1
#monitor = DP-3, preferred, -1800x-2160@165, 1, bitdepth, 10, cm, hdr, sdrbrightness, 1.38, sdrsaturation, 0.9
monitorv2 {
    output = DP-3
    mode = 5120x2160@165.05800
    position = -1800x-2160
    scale = 1
    bitdepth = 10
    #cm = hdr
    sdrbrightness = 1.0
    sdrsaturation = 1.0
    supports_wide_color = 0
    supports_hdr = 0
    sdr_min_luminance = 0.005
    sdr_max_luminance = 425
    min_luminance = 0
    max_luminance = 1500
    max_avg_luminance = 400
}

experimental:xx_color_management_v4 = true
render {
  cm_fs_passthrough = 2
  cm_auto_hdr = 1
}

#monitor = , preferred, auto, 1, mirror, DP-1 # MIRROR

# exec-once=pipewire exec-once=wireplumber exec-once=pipewire-pulseaudio
###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$vscode = code
$web = firefox
$fileManager = dolphin
$menu = wofi --show drun
$wallpaper = ~/wallpaper.gif


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
# exec-once=gBar bar 0
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=sudo powertop --auto-tune
exec-once= hyprpaper
#exec-once = swww init & swww img $wallpaper # diseable to power save
exec-once = nm-applet --indicator
exec-once = blueman-applet
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

source = ./style.conf

# input
source = ./input.conf

# keybinds
source = ./keybinds.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

###################
### SCRATCHPADS ###
###################

source = ./scratchpads.conf

# other
misc {
    focus_on_activate=yes
    vfr=true
}